# Sturdy Octo Guide Workflow Apply Upstream Pr Changes

## Action

Follow the apply-upstream-pr-changes workflow:
1. Identify relevant upstream pull requests.
2. Select full patch files to apply.
3. Apply patches to the repository, updating affected files (e.g., workflows, documentation, test files, source code).
4. Commit the changes with a standard message.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~6x per month
- Files: .github/workflows/build-and-test.yml, .github/workflows/e2e-base.yml, .github/workflows/lint.yml

